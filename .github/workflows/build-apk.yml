name: Build APK

# طبق درخواست: چون شبکه‌ی لوکال به pub.dev/dl.google.com/Maven به‌طورِ
# پایدار دسترسی نداشت، این بیلد روی سرورهایِ خودِ گیت‌هاب اجرا می‌شود که
# دسترسیِ اینترنتِ کاملاً سالم دارند — پس همان مشکلِ قطعیِ دانلود دیگر
# رخ نمی‌دهد.
#
# پیش‌فرض فقط دستی (workflow_dispatch) اجرا می‌شود تا هر پوش به‌طورِ
# خودکار دقیقه‌هایِ اکشنز را مصرف نکند؛ از تبِ Actions در گیت‌هاب،
# «Run workflow» را بزنید.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "نوع بیلد"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      publish:
        description: "انتشار برای به‌روزرسانیِ درون‌برنامه (bpm.itmalek.com/app-releases)"
        required: false
        default: true
        type: boolean
      forced:
        description: "به‌روزرسانیِ اجباری (نسخه‌های قدیمی‌تر بدون نصبِ این نسخه کار نمی‌کنند)"
        required: false
        default: false
        type: boolean
      notes:
        description: "توضیح تغییرات (در پنجرهٔ به‌روزرسانی نمایش داده می‌شود)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔧 جاوای پیش‌فرضِ ماشینِ گیت‌هاب به ۲۵ رسید و Gradle با آن کار نمی‌کند (خطای «25.0.5»)؛
      # همان ۱۷ که پروژه با آن ساخته می‌شود (android/app/build.gradle.kts) ثابت می‌شود.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 🔧 همان نسخه‌ای که لوکال نصب است (برایِ دورزدنِ باگِ شناخته‌شده‌ی
          # «security advisories» در نسخه‌هایِ جدیدترِ ابزارِ pub)
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 🔧 بدونِ این مرحله، چون android/key.properties رویِ گیت‌هاب
      # وجود ندارد (عمداً، چون حاویِ رمزِ کلیدِ امضا است)، بیلدِ release
      # به‌طورِ خودکار به کلیدِ debug برمی‌گشت — که همان دلیلِ اصلیِ
      # هشدارِ «Google Play Protect» هنگامِ نصب بود. این مرحله کلیدِ
      # واقعی را از Secretsِ همین ریپو می‌سازد، فقط در حافظه‌ی رانرِ
      # موقتِ گیت‌هاب، هرگز در کد کامیت نمی‌شود.
      - name: Set up release signing
        if: inputs.build_mode == 'release'
        run: |
          mkdir -p android/keystore-backup
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore-backup/malekbpm-release.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../keystore-backup/malekbpm-release.jks
          EOF

      # 🔧 حجم: بازار سقفِ ۲۵ مگ دارد و APKِ «همه‌کاره» (سه پردازنده با هم)
      # حدودِ ۷۰ مگ بود. حالا برایِ هر پردازنده یک APKِ جدا ساخته می‌شود
      # (arm64 برایِ گوشی‌هایِ امروزی، armv7 برایِ گوشی‌هایِ قدیمیِ ۳۲بیتی؛
      # x86_64 فقط شبیه‌ساز است و حذف شد) و کدِ Dart فشرده/مبهم می‌شود.
      # فایل‌هایِ اشکال‌زدایی (برایِ خواندنِ گزارشِ کرش) جدا آپلود می‌شوند.
      # شمارهٔ ساخت هر بار بالا می‌رود (۱۰۰ + شمارهٔ اجرای همین workflow) تا اپِ نصب‌شده
      # نسخهٔ جدید را تشخیص دهد؛ نامِ نسخه (مثل 1.0.3) از pubspec.yaml
      - name: Version
        id: ver
        run: |
          echo "build=$((100 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          echo "name=$(awk '/^version:/{split($2,a,"+"); print a[1]}' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          if [ "${{ inputs.build_mode }}" = "release" ]; then
            flutter build apk --release --split-per-abi               --target-platform android-arm,android-arm64               --build-number=${{ steps.ver.outputs.build }}               --obfuscate --split-debug-info=build/debug-info
          else
            flutter build apk --debug --build-number=${{ steps.ver.outputs.build }}
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_mode }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload debug symbols
        if: inputs.build_mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/debug-info
          retention-days: 90

      # ── انتشار برای به‌روزرسانیِ درون‌برنامه (lib/core/update/app_updater.dart) ──
      # APKها با نامِ نسخه + latest.json در /var/www/itmalek/app-releases. latest.json آخر از همه
      # آپلود می‌شود تا هیچ‌وقت به فایلی اشاره نکند که هنوز نرسیده. min_build: اجباری = همین
      # ساخت؛ وگرنه همان مقدارِ قبلیِ سرور می‌ماند (اجباریِ قبلی لغو نمی‌شود).
      - name: Prepare release files
        if: inputs.build_mode == 'release' && inputs.publish
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          B=${{ steps.ver.outputs.build }}; V=${{ steps.ver.outputs.name }}
          mkdir -p release
          for abi in arm64-v8a armeabi-v7a; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "release/bpm-$V-$B-$abi.apk"
          done
          # latest.json فعلیِ سرور: هم min_build قبلی، هم نگه‌داشتنِ سابقه‌اش به نامِ release-<build>.json
          # (صفحهٔ https://bpm.itmalek.com/app-releases/ فهرستِ نسخه‌ها را از همین فایل‌ها می‌سازد)
          curl -fsS "https://bpm.itmalek.com/app-releases/latest.json?t=$(date +%s)" -o prev.json 2>/dev/null || echo '{}' > prev.json
          PREV_MIN=$(jq -r '.min_build // 0' prev.json 2>/dev/null || echo 0)
          PREV_B=$(jq -r '.build // 0' prev.json 2>/dev/null || echo 0)
          if [ "${PREV_B:-0}" -gt 0 ] && [ "$PREV_B" != "$B" ]; then cp prev.json "release/release-$PREV_B.json"; fi
          if [ "${{ inputs.forced }}" = "true" ]; then MIN=$B; else MIN=${PREV_MIN:-0}; fi
          base="https://bpm.itmalek.com/app-releases"
          jq -n --arg v "$V" --argjson b "$B" --argjson min "$MIN" --arg notes "$NOTES"             --arg at "$(TZ=Asia/Tehran date '+%Y-%m-%d %H:%M')"             --arg u64 "$base/bpm-$V-$B-arm64-v8a.apk" --argjson s64 "$(stat -c %s release/bpm-$V-$B-arm64-v8a.apk)"             --arg u32 "$base/bpm-$V-$B-armeabi-v7a.apk" --argjson s32 "$(stat -c %s release/bpm-$V-$B-armeabi-v7a.apk)"             '{version:$v, build:$b, min_build:$min, notes:$notes, released_at:$at,
              files:{"arm64-v8a":{url:$u64,size:$s64}, "armeabi-v7a":{url:$u32,size:$s32}}}' > latest.json
          cp latest.json "release/release-$B.json"
          cat latest.json

      - name: Upload APKs + release history to server
        if: inputs.build_mode == 'release' && inputs.publish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "release/*"
          target: /var/www/itmalek/app-releases
          strip_components: 1

      - name: Publish latest.json
        if: inputs.build_mode == 'release' && inputs.publish
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: latest.json
          target: /var/www/itmalek/app-releases
