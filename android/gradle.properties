# 🔧 سیستمِ لوکال کلاً ۸ گیگ رم دارد؛ ۸G هیپ + ۴G متاسپیس باعثِ کرشِ دیمونِ
# Gradle با «insufficient memory» می‌شد. این مقادیر برایِ بیلدِ فلاتر کافی است
# (رویِ رانرِ گیت‌هاب هم بی‌مشکل)
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# ماژولِ Push پلاگینِ متریکس را فعال می‌کند (غلطِ املاییِ «notitifcation» عیناً
# همان کلیدی است که پلاگین می‌خواند)
metrix.notitifcation.enable=true
# 🔧 بیلدِ لوکالِ ویندوز: پروژه رویِ درایوِ D و کشِ پکیج‌ها رویِ C است؛ کامپایلِ
# افزایشیِ کاتلین با «this and base files have different roots» شکست می‌خورد.
# با خاموش‌کردنش، هر بار کامل (و بدونِ خطا) کامپایل می‌شود
kotlin.incremental=false
